name: CI

on:
  push:
  pull_request:
    branches: [ master ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: debug
      run: |
        id
        which bash
        whoami
        env
        ps -ef
        pwd
        cat /proc/self/uid_map
        cat /proc/self/status
        systemd-detect-virt
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install automake autopoint xsltproc gettext expect byacc libtool
    - name: configure
      run: |
        ./autogen.sh --without-selinux --disable-man
        grep ENABLE_ config.status
    - run: make
    - run: make install DESTDIR=${HOME}/rootfs
    - run: sudo make install
    - name: run su 01 su_root.test
      run: cd tests && sudo ./su/01/su_root.test
    - name: run su 01 su_user.test
      run: cd tests && sudo ./su/01/su_user.test
